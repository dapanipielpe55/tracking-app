workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - npm install
      - npm install @capacitor/cli

      # Verificar estructura
      - ls
      - ls www

      # Inicializar capacitor
      - npx cap init tracking com.tracking.app --web-dir=www

      # Forzar copia web
      - npx cap copy

      # Crear android (clave)
      - npx cap add android

      # Sincronizar
      - npx cap sync

      # Verificar android existe
      - ls
      - ls android

      # Compilar
      - cd android
      - chmod +x gradlew || true
      - ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.apk
