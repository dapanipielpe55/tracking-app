workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - npm install
      - npm install @capacitor/cli

      # Inicializar capacitor correctamente
      - npx cap init tracking com.tracking.app --web-dir=www

      # Crear android (sin || true para ver errores reales)
      - npx cap add android

      # Sincronizar
      - npx cap sync

      # Verificar que existe android
      - ls
      - ls android

      # Entrar y compilar
      - cd android
      - chmod +x gradlew
      - ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.apk
