workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - npm install
      - npm install @capacitor/cli

      # DEBUG estructura
      - pwd
      - ls -la
      - ls -la www || echo "NO EXISTE WWW"

      # Inicializar capacitor (forzado limpio)
      - rm -rf android
      - npx cap init tracking com.tracking.app --web-dir=www

      # ESTE ES EL PASO CLAVE (sin || true)
      - npx cap add android

      # Verificar si se creó android
      - ls -la
      - ls -la android || echo "ANDROID NO SE CREO"

      # Sync
      - npx cap sync

      # Verificar gradlew
      - ls android
      - ls android | grep gradlew || echo "NO HAY GRADLEW"

      # Compilar
      - cd android
      - chmod +x gradlew
      - ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.apk
