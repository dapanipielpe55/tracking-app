workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - cd android
      - ls -la | grep gradlew  # Verifica que existe
      - file ./gradlew  # Verifica que es ejecutable
      - ./gradlew --version  # Verifica que funciona
      - ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
