workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - npm install

      # Instalar todo Capacitor correctamente
      - npm install @capacitor/core @capacitor/cli @capacitor/android

      # Inicializar
      - npx cap init tracking com.tracking.app --web-dir=www

      # Crear android
      - npx cap add android

      # Verificar
      - ls -la
      - ls -la android

      # Sync
      - npx cap sync

      # Compilar
      - cd android
      - chmod +x gradlew
      - ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.apk
