workflows:
  android-build:
    name: Android Build
    environment:
      node: latest
    scripts:
      - npm install
      - npm install @capacitor/cli

      # Crear capacitor correctamente
      - npx cap init tracking com.tracking.app --web-dir=www

      # IMPORTANTE: instalar android platform antes
      - npm install @capacitor/android

      # Crear android (ahora sí funciona)
      - npx cap add android

      # Sync
      - npx cap sync

      # Compilar
      - cd android
      - chmod +x gradlew
      - ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
